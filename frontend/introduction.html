<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DonorLedger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap"

    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="introduction-screen">
    <main class="hero-page" data-node-id="1:3">
      <nav class="top-nav" data-node-id="1:51" aria-label="Primary navigation">
        <a class="brand" href="/" data-node-id="1:55">DonorLedger</a>

      <section class="hero" data-node-id="1:5" aria-labelledby="hero-title">
        <div class="hero-copy" data-node-id="1:9">
          <div class="launch-pill" data-node-id="1:11">Official Launch</div>

          <h1 id="hero-title" class="hero-title" data-node-id="1:14">
            <span>The Most</span>
            <span class="accent">Trusted</span>
            <span>Charity</span>
            <span>Platform in</span>
            <span>Malaysia</span>

          <p class="hero-summary" data-node-id="1:16">
            Ensuring every Ringgit reaches its destination through immutable
            ledgers and real-time impact reporting.

          <div class="hero-actions" data-node-id="1:17">
            <a class="button button-primary" href="./login.html" data-node-id="1:18">

            </a>
            <a class="button button-secondary" href="./login.html?role=ngo" data-node-id="1:21">

          </div>

          <div class="ngo-proof" data-node-id="1:23">
            <div class="avatar-stack" aria-hidden="true">
              <span></span>

              <span></span>

          </div>
        </div>

        <div class="logo-collage" aria-hidden="true" data-node-id="1:32">
          <article class="logo-card card-education" data-node-id="1:56">
            <img
              src="./assets/children-education.png"
              alt=""
              loading="eager"
            />
          </article>
          <article class="logo-card card-wwf" data-node-id="1:45">
            <img src="./assets/wwf-logo.png" alt="" loading="eager" />
          </article>
          <article class="logo-card card-medicaid" data-node-id="1:34">
            <img
              src="./assets/medicaid-alliance.png"

              loading="eager"
            />
          </article>
          <article class="logo-card card-global" data-node-id="1:48">
            <img src="./assets/global-relief.png" alt="" loading="eager" />
          </article>
          <article class="logo-card card-ocean" data-node-id="1:38">
            <img src="./assets/ocean-guardians.png" alt="" loading="lazy" />
          </article>
          <article class="logo-card card-earthcare" data-node-id="1:41">
            <img
              src="./assets/earthcare-sustainability-charity.png"
              alt=""
              loading="lazy"
            />
          </article>
