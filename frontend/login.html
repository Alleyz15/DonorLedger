<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | DonorLedger</title>
    <script>
      ;(function redirectAppLogoutToWelcome() {
        if (localStorage.getItem('donorledger.auth')) return
        if (!document.referrer) return

        try {
          var referrer = new URL(document.referrer)
          if (referrer.origin !== window.location.origin) return

          var publicPages = [
            '/',
            '/introduction.html',
            '/login.html',
            '/sign-up.html',
            '/register-ngo.html',
          ]

          if (!publicPages.includes(referrer.pathname)) {
            window.location.replace('./introduction.html')
          }
        } catch (_error) {
          // Keep the login page available when the referrer cannot be parsed.
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./pages/login/login-page.js?v=20260524-dashboard"></script>
  </head>
  <body class="login-screen">
    <main class="login-page" data-node-id="3:4">
      <nav class="login-nav" data-node-id="3:79" aria-label="Primary navigation">
        <a class="login-brand" href="./introduction.html" data-node-id="3:81">
          <span class="brand-mark" data-node-id="3:82">D</span>
          <span data-node-id="3:86">DonorLedger</span>
        </a>
      </nav>

      <section class="login-hero" data-node-id="3:6" aria-labelledby="login-title">
        <div class="login-bg-grid" aria-hidden="true" data-node-id="3:9">
          <div class="login-logo-card login-bg-1">
            <img src="./assets/global-relief.png" alt="" />
          </div>
          <div class="login-logo-card login-bg-2">
            <img src="./assets/medicaid-alliance.png" alt="" />
          </div>
          <div class="login-logo-card login-bg-3">
            <img src="./assets/earthcare-sustainability-charity.png" alt="" />
          </div>
          <div class="login-logo-card login-bg-4">
            <img src="./assets/children-education.png" alt="" />
          </div>
          <div class="login-logo-card login-bg-5">
            <img src="./assets/ocean-guardians.png" alt="" />
          </div>
          <div class="login-logo-card login-bg-6">
            <img src="./assets/wwf-logo.png" alt="" />
          </div>
          <div class="login-logo-card login-bg-7">
            <img src="./assets/global-relief.png" alt="" />
          </div>
          <div class="login-logo-card login-bg-8">
            <img src="./assets/children-education.png" alt="" />
          </div>
        </div>

        <form class="login-card" data-node-id="3:51" novalidate>
          <h1 id="login-title" data-node-id="3:54">Welcome Back</h1>
          <p data-node-id="3:56">
            Enter your credentials to manage your donations.
          </p>

          <div class="login-form" data-node-id="3:57">
            <label class="field" data-node-id="3:58">
              <span data-node-id="3:60">Email</span>
              <input
                data-node-id="3:61"
                type="email"
                name="email"
                autocomplete="username"
                placeholder="Enter your email"
              />
            </label>

            <label class="field" data-node-id="3:64">
              <span class="field-row" data-node-id="3:65">
                <span data-node-id="3:67">Password</span>
                <a href="#forgot-password" data-node-id="3:69">Forgot Password?</a>
              </span>
              <input
                data-node-id="3:70"
                type="password"
                name="password"
                autocomplete="current-password"
                placeholder="Enter your password"
              />
            </label>

            <button class="login-button" type="submit" data-node-id="3:73">
              Login
            </button>

            <div class="form-status" role="status" aria-live="polite"></div>
            <p class="login-register-prompt" hidden>
              Don't have an account?
              <a href="./register-ngo.html">Register Now</a>
            </p>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
